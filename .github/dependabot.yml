version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Pinned to Kotlin 2.1.x for Kotlin 2.0 consumer compatibility (Issue #546)
      - dependency-name: "org.jetbrains.kotlin*"
        versions: [">= 2.2.0"]
      # kotlinx-coroutines >= 1.11.0 is compiled with Kotlin 2.2+ (KLIB ABI 2.2.0)
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines*"
        versions: [">= 1.11.0"]
      # Gradle 9.x and AGP 9.x require Kotlin 2.2+ (Issue #546)
      - dependency-name: "gradle-wrapper"
        versions: [">= 9.0.0"]
      - dependency-name: "com.android.library"
        versions: [">= 9.0.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
